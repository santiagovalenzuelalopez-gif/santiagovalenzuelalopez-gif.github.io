name: Sitio
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: el HTML generado está al día con el contenido
        run: |
          python tools/build.py
          git diff --exit-code -- . ':!sitemap.xml'
      - name: enlaces, anclas, metadatos y contenido prohibido
        run: python tools/check.py
